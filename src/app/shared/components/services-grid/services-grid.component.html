<section class="services" (mouseenter)="stop()" (mouseleave)="start()">
  <div class="container">

    <!-- Title with lines on both sides -->
    <div class="services-title">
      <h2>{{ title() }}</h2>
    </div>

    <!-- Carousel -->
    <div class="viewport">
      <div class="track"
           [style.--per-view]="perView()"
           [style.transform]="'translateX(' + (-index() * 100 / perView()) + '%)'">

        @for (s of services(); track s.path; let i = $index) {
          <div class="slide">
            <a class="service-card" [routerLink]="s.path" [attr.tabindex]="isVisible(i) ? 0 : -1">

              <h3>{{ s.title }}</h3>
              <p>{{ s.description }}</p>

              <span class="read-more">
                Read more
                <span class="triangle"></span>
              </span>

            </a>
          </div>
        }

      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button type="button" class="arrow-btn" aria-label="Previous" (click)="prev()">
        <i class="bi bi-arrow-left"></i>
      </button>

      <div class="dots">
        @for (d of dots(); track d) {
          <button type="button" [class.active]="d === index()"
                  [attr.aria-label]="'Go to position ' + (d + 1)" (click)="go(d)"></button>
        }
      </div>

      <button type="button" class="arrow-btn" aria-label="Next" (click)="next()">
        <i class="bi bi-arrow-right"></i>
      </button>
    </div>

  </div>
</section>
